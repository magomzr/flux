<div class="flex h-screen overflow-hidden" style="background-color: var(--bg-base)">
  <!-- Sidebar -->
  <aside
    class="w-56 flex-shrink-0 flex flex-col border-r"
    style="background-color: var(--sidebar-bg); border-color: var(--sidebar-border)"
  >
    <!-- Logo -->
    <div class="h-14 flex items-center px-4 border-b" style="border-color: var(--sidebar-border)">
      <span class="text-lg font-semibold tracking-tight" style="color: var(--text-primary)">
        flux
      </span>
    </div>

    <!-- Nav -->
    <nav class="flex-1 px-2 py-3 space-y-1.5 overflow-y-auto">
      @for (item of navItems(); track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="sidebar-active"
        class="flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm transition-colors hover:opacity-80"
        style="background-color: var(--bg-elevated); color: var(--text-secondary)"
        [routerLinkActiveOptions]="{ exact: false }"
      >
        <svg
          class="w-4 h-4 flex-shrink-0"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path [attr.d]="item.icon" />
        </svg>
        {{ item.label }}
      </a>
      }
    </nav>

    <!-- Footer: user + theme toggle -->
    <div class="border-t p-3 space-y-3" style="border-color: var(--sidebar-border)">
      <!-- Theme toggle -->
      <button
        (click)="theme.toggle()"
        class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm transition-colors cursor-pointer hover:opacity-80"
        style="background-color: var(--bg-elevated); color: var(--text-secondary)"
      >
        @if (theme.isDark()) {
        <svg
          class="w-4 h-4 flex-shrink-0"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="5" />
          <path
            d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
          />
        </svg>
        <span>Modo claro</span>
        } @else {
        <svg
          class="w-4 h-4 flex-shrink-0"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
        <span>Modo oscuro</span>
        }
      </button>

      <!-- User -->
      <div class="flex items-center gap-2.5 px-2 py-1.5">
        <div
          class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-medium flex-shrink-0 text-white"
          style="background-color: var(--accent)"
        >
          {{ userInitial() }}
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-medium truncate" style="color: var(--text-primary)">
            {{ userName() }}
          </p>
          <button
            (click)="showChangePassword.set(true)"
            class="text-xs transition-colors cursor-pointer text-left"
            style="color: var(--text-muted)"
          >
            Cambiar contraseña
          </button>
        </div>
        <button
          (click)="logout()"
          title="Sign out"
          class="p-1.5 rounded-lg transition-colors cursor-pointer hover:opacity-80"
          style="background-color: var(--bg-elevated); color: var(--text-muted)"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 overflow-y-auto" style="background-color: var(--bg-base)">
    <router-outlet />
  </main>
</div>

<!-- Change password modal -->
@if (showChangePassword()) {
<div
  class="fixed inset-0 flex items-center justify-center z-50 px-4"
  style="background-color: var(--bg-overlay)"
>
  <div
    class="border rounded-xl p-6 max-w-sm w-full"
    style="background-color: var(--bg-surface); border-color: var(--border)"
  >
    <h3 class="text-sm font-medium mb-4" style="color: var(--text-primary)">Cambiar contraseña</h3>

    <form [formGroup]="pwForm" (ngSubmit)="submitChangePassword()" class="space-y-3">
      <div class="space-y-1">
        <label class="text-xs uppercase tracking-wider" style="color: var(--text-muted)"
          >Contraseña actual</label
        >
        <input
          formControlName="currentPassword"
          type="password"
          class="w-full rounded-lg px-3 py-2 text-sm border focus:outline-none focus:ring-2 focus:border-transparent"
          style="
            background-color: var(--input-bg);
            border-color: var(--input-border);
            color: var(--text-primary);
            --tw-ring-color: var(--input-focus);
          "
        />
      </div>
      <div class="space-y-1">
        <label class="text-xs uppercase tracking-wider" style="color: var(--text-muted)"
          >Nueva contraseña</label
        >
        <input
          formControlName="newPassword"
          type="password"
          placeholder="Mín. 8 caracteres"
          class="w-full rounded-lg px-3 py-2 text-sm border focus:outline-none focus:ring-2 focus:border-transparent"
          style="
            background-color: var(--input-bg);
            border-color: var(--input-border);
            color: var(--text-primary);
            --tw-ring-color: var(--input-focus);
          "
        />
      </div>

      @if (pwError()) {
      <p
        class="text-xs rounded-lg px-3 py-2"
        style="
          color: var(--danger-fg);
          background-color: var(--danger-subtle);
          border: 1px solid var(--danger-fg);
        "
      >
        {{ pwError() }}
      </p>
      } @if (pwSuccess()) {
      <p
        class="text-xs rounded-lg px-3 py-2"
        style="color: var(--success-fg); background-color: var(--success-subtle)"
      >
        Contraseña actualizada exitosamente.
      </p>
      }

      <div class="flex justify-end gap-2 pt-1">
        <button
          type="button"
          (click)="cancelChangePassword()"
          class="text-sm px-3 py-1.5 rounded-lg transition-colors cursor-pointer"
          style="color: var(--text-secondary)"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="pwForm.invalid || pwSaving()"
          class="text-sm font-medium px-3 py-1.5 rounded-lg transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
          style="background-color: var(--accent); color: var(--accent-fg)"
        >
          {{ pwSaving() ? "Guardando..." : "Cambiar" }}
        </button>
      </div>
    </form>
  </div>
</div>
}
